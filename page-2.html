<style>:root{--bg:#705943;--surface:#30271f;--text:#fff7eb;--muted:#c9b9a5;--accent:#e6a45b;--radius:4px;--button-radius:4px;--section-space:76px;--heading-font:"Inter";--body-font:"Inter"}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--body-font),sans-serif}a{color:inherit}.site-header,.site-footer,.section{padding-inline:max(24px,calc((100vw - 1080px)/2))}.site-header{min-height:76px;display:flex;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent)}.site-header nav{display:flex;gap:20px;margin-left:auto}.site-header nav a{color:var(--muted);text-decoration:none}.site-header nav a:hover{color:var(--text)}.brand{font-weight:800;text-decoration:none;font-size:1.15rem}.section{padding-block:var(--section-space);background:var(--section-background,transparent)}.section-hero{min-height:460px;display:flex;flex-direction:column;justify-content:center}.section.center{text-align:center;align-items:center}.section h1,.section h2{font-family:var(--heading-font),sans-serif;line-height:1.08;letter-spacing:-.04em;margin:0 0 20px;max-width:900px}.section h1{font-size:clamp(2.5rem,7vw,5.4rem)}.section h2{font-size:clamp(2rem,4vw,3.4rem)}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;color:var(--accent);font-weight:700}.section-copy{max-width:650px;color:var(--muted);font-size:clamp(1.05rem,2vw,1.25rem)}.section-blocks{display:flex;align-items:center;flex-wrap:wrap;gap:18px;margin-top:26px}.section.center .section-blocks{justify-content:center}.section-features .section-blocks,.section-services .section-blocks,.section-team .section-blocks,.section-pricing .section-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}.section-features .section-blocks>h3,.section-services .section-blocks>h3,.section-team .section-blocks>h3,.section-pricing .section-blocks>h3{background:var(--surface);padding:24px;border-radius:var(--radius);margin:0}.section-blocks p{color:var(--muted)}.content-image{max-width:100%;height:auto;border-radius:var(--radius)}.image-placeholder{min-height:180px;display:grid;place-items:center;background:var(--surface);border-radius:var(--radius);color:var(--muted);padding:24px}.section hr{width:100%;border:0;border-top:1px solid color-mix(in srgb,var(--text) 18%,transparent)}.spacer-block{flex-basis:100%;height:32px}.icon-block{font-size:2rem;color:var(--accent)}.embedded-content{width:min(100%,900px);aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius);background:var(--surface)}.embedded-content.map{aspect-ratio:4/3}.embedded-content iframe{width:100%;height:100%;border:0}.embed-placeholder{width:100%;min-height:180px;display:grid;place-items:center;border:1px dashed var(--muted);border-radius:var(--radius);color:var(--muted)}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;width:100%}.gallery-grid .content-image,.gallery-grid .image-placeholder{width:100%;height:220px;object-fit:cover}.content-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px;width:100%}.content-column{min-width:0}.social-link{display:inline-flex;padding:9px 13px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);text-decoration:none}.site-footer{padding-block:30px;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--text) 12%,transparent)}@media(max-width:600px){.site-header,.site-footer,.section{padding-inline:20px}.site-header nav{gap:10px;font-size:13px}.section-hero{min-height:400px}.section-blocks{align-items:stretch}.section-blocks>.button{width:100%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:var(--button-radius);background:var(--accent);color:#fff;text-decoration:none;font-weight:700}.section-features .section-blocks>.content-columns{grid-column:1/-1}.section-features .content-column{padding:24px;border-radius:var(--radius);background:var(--surface)}@media(max-width:600px){.site-header{min-height:0;flex-wrap:wrap;gap:4px 12px;padding-block:14px}.site-header nav{width:100%;margin-left:0;flex-wrap:wrap;gap:6px 14px}}</style>
